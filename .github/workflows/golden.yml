name: golden

# Golden cases against real OpenFOAM installations: org 14 and com v2606.
#
# The OpenFOAM images ship neither git nor node, so they run as plain docker
# images (checkout and the workflow itself stay on the host). Start the workflow
# manually until the matrix has been proven once; then it can move to `push`.
on:
  workflow_dispatch:

jobs:
  golden:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: org
            image: dicehub/openfoam:14
          - distribution: com
            image: dicehub/openfoam:opencfd-2606
    steps:
      - uses: actions/checkout@v4

      - name: golden cases (${{ matrix.distribution }})
        env:
          IMAGE: ${{ matrix.image }}
          DIST: ${{ matrix.distribution }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/w -w /w -e HOME=/tmp -e DIST="$DIST" "$IMAGE" bash /w/scripts/ci-golden.sh
