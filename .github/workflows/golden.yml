name: golden

# Runs the golden cases against real OpenFOAM installations: org 14 and com v2606.
# The cases live in test/golden/, the reference numbers in test/golden/expected/.
# Re-bless a value only with `node scripts/run-golden.mjs --update` and a reviewed
# explanation in the commit message.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  golden:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: org
            image: dicehub/openfoam:14
          - distribution: com
            image: dicehub/openfoam:opencfd-2606
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: node runtime (the harness is JavaScript)
        run: |
          set -e
          if command -v node >/dev/null 2>&1; then node --version; exit 0; fi
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq curl ca-certificates xz-utils >/dev/null
          fi
          curl -fsSL https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz -o /tmp/node.tar.xz
          mkdir -p /opt/node && tar -xJf /tmp/node.tar.xz -C /opt/node --strip-components=1
          ln -sf /opt/node/bin/node /usr/local/bin/node
          node --version

      - name: show the installation
        run: node -e "import('./lib/discover.js').then(m => console.log(JSON.stringify(m.discoverFoamRoots().found, null, 1)))"

      - name: golden cases (${{ matrix.distribution }})
        run: node scripts/run-golden.mjs --distribution ${{ matrix.distribution }}
