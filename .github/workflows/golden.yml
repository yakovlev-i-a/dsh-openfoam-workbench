name: golden

# Golden cases against real OpenFOAM installations: org 14 and com v2606.
#
# The OpenFOAM images ship neither git nor node, so they run as plain docker
# images (checkout and the workflow itself stay on the host). The matrix is proven
# for org 14 and com v2606, so it also runs on every push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  golden:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: org
            image: dicehub/openfoam:14
          - distribution: com
            image: dicehub/openfoam:opencfd-2606
    steps:
      - uses: actions/checkout@v4

      - name: golden cases (${{ matrix.distribution }})
        env:
          IMAGE: ${{ matrix.image }}
          DIST: ${{ matrix.distribution }}
        run: |
          set -euo pipefail
          # --entrypoint: the images define their own entrypoint (a login shell),
          # which would swallow the command and exit silently.
          # --user root: the images run as an unprivileged user, and the Node
          # bootstrap needs apt. --entrypoint: the image ships a login-shell
          # entrypoint that would swallow the command.
          docker run --rm --user root --entrypoint bash \
            -v "$PWD":/w -w /w -e HOME=/root -e DIST="$DIST" \
            "$IMAGE" -c 'bash /w/scripts/ci-golden.sh' 
