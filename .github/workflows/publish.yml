name: publish

# Publish the tagged version to npm.
#
# Triggered by a version tag (the same commit the market index pins). npm is
# version-addressed: every release needs its own publish, so this job is the
# release step, not a one-off. It stays green without a token and publishes once
# NPM_TOKEN exists as a repository secret (a granular token with bypass 2FA —
# publishing requires 2FA on the account).
on:
  push:
    tags: ['v*']

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: the tag must match package.json
        run: |
          node -e '
            const pkg = require("./package.json")
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "")
            if (pkg.version !== tag) {
              console.error(`package.json says ${pkg.version}, the tag says ${tag}`)
              process.exit(1)
            }
            console.log(`publishing ${pkg.name}@${pkg.version}`)
          '

      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not configured as a repository secret: skipping the npm publish."
            echo "Add it with: gh secret set NPM_TOKEN  (a granular token with bypass 2FA)."
            exit 0
          fi
          npm publish --access public --provenance
