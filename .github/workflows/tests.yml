name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # The suite is host-agnostic: OpenFOAM/ParaView/DSH are simulated by
      # fixtures, and the tests that need a host installation skip themselves.
      - name: Unit tests
        run: node --test test/*.test.mjs
