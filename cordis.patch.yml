# dsh-openfoam-workbench bundle: mount the OpenFOAM Workbench plugin.
# EDIT THESE PATHS for your machine before installing.
- insert:
    - id: openfoam-workbench
      name: '@yakovlev-i-a/dsh-openfoam-workbench'
      config:
        foamRoots:
          org: /opt/openfoam14
          com: /usr/lib/openfoam/openfoam2606
        defaultDistribution: org
        paraviewExe: /opt/paraview/bin/paraview
        paraviewPython: /opt/paraview/bin/pvpython
        caseRoots:
          - /media/yakovlev-i-a/adata-legend-512/openfoam-dev
